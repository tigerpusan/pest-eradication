name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create . --platforms=android --org com.pesteradication --project-name pest_eradication

      - name: Apply app name and icon
        run: |
          sed -i 's/android:label="pest_eradication"/android:label="해충 박멸"/' android/app/src/main/AndroidManifest.xml
          cp assets/android_icons/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp assets/android_icons/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp assets/android_icons/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp assets/android_icons/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp assets/android_icons/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Get dependencies
        run: flutter pub get

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Run basic app test
        run: flutter test test/basic_app_test.dart

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk pest-eradication-v0.1.7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pest-eradication-v0.1.7-apk
          path: pest-eradication-v0.1.7.apk
          retention-days: 30
