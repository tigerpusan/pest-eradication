name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter create . \
            --platforms=android \
            --org com.pesteradication \
            --project-name pest_eradication

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             pest-eradication-v0.1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pest-eradication-v0.1.1-apk
          path: pest-eradication-v0.1.1.apk
          retention-days: 30
