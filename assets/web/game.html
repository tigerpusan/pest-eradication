<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>해충 박멸 V0.1.3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#07131b;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;touch-action:none}
#game{position:relative;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 26%,#eefbff 0 10%,transparent 32%),linear-gradient(#70caf1 0%,#c1efff 55%,#89c85a 56%,#3f6f32 100%)}
#game:after{content:"";position:absolute;left:-5%;right:-5%;bottom:0;height:40%;background:linear-gradient(180deg,#72b84f,#3d7934 65%,#264b2c);opacity:.92;z-index:0}
.cloud{position:absolute;background:#fff5;border-radius:60px;width:150px;height:56px;filter:blur(1px)}
.c1{top:120px;left:-15px}.c2{top:210px;right:-25px;width:120px;height:42px}.c3{top:340px;left:60px;width:190px;height:62px;opacity:.4}
.topHud{position:absolute;z-index:20;left:12px;right:12px;top:12px;display:grid;grid-template-columns:56px 1fr 120px;gap:10px;align-items:center}
#backBtn,.stageCard,.timeCard,.scoreCard,.missCard{background:#09243add;border:1px solid #ffffff35;border-radius:18px;color:#fff;box-shadow:0 8px 24px #0018}
#backBtn{height:58px;font-size:42px;color:#fff;line-height:42px}
.stageCard,.timeCard,.scoreCard,.missCard{display:flex;align-items:center;justify-content:center;font-weight:1000}
.stageCard{height:58px;font-size:19px}
.timeCard{height:58px;font-size:18px;color:#ffe16a}
.subHud{position:absolute;z-index:19;left:78px;right:12px;top:82px;display:grid;grid-template-columns:1fr 150px;gap:10px}
.scoreCard,.missCard{height:52px;font-size:17px}
.scoreCard{justify-content:flex-start;padding-left:20px}
.scoreCard #score{font-size:26px;margin-left:10px}
#levelBanner{position:absolute;z-index:18;left:50%;top:145px;transform:translateX(-50%);background:#071b2dd9;color:#fff;padding:8px 16px;border-radius:16px;font-size:18px;font-weight:1000;box-shadow:0 6px 16px #0004}
#cross{position:absolute;z-index:15;width:54px;height:54px;border:3px solid #ff3838;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#ff3838}
#cross:before{width:72px;height:3px}#cross:after{width:3px;height:72px}
#tip{position:absolute;z-index:16;left:50%;bottom:16px;transform:translateX(-50%);background:#071b2de8;color:#fff;padding:10px 18px;border-radius:18px;border:1px solid #ffffff30;font-size:15px;font-weight:900}
#rifle{position:absolute;z-index:12;left:50%;bottom:-12px;width:180px;height:260px;transform:translateX(-50%);transform-origin:50% 100%;pointer-events:none;filter:drop-shadow(0 12px 10px #0006)}
#rifle .barrel{position:absolute;left:76px;top:0;width:28px;height:165px;border-radius:12px 12px 4px 4px;background:linear-gradient(90deg,#080808,#7c858c 40%,#181818 72%,#090909);box-shadow:inset 0 0 0 2px #889099}
#rifle .muzzle{position:absolute;left:71px;top:-8px;width:38px;height:18px;border-radius:50%;background:#111;border:4px solid #636c74}
#rifle .body{position:absolute;left:58px;top:145px;width:58px;height:18px;border-radius:10px;background:#1a1a1a;box-shadow:0 4px 0 #5a6166}
#rifle .scope{position:absolute;left:46px;top:102px;width:42px;height:28px;border:5px solid #202020;border-radius:50%;background:transparent}
#rifle .stock{position:absolute;left:40px;top:160px;width:76px;height:82px;background:linear-gradient(135deg,#8d5634,#391f17);border:4px solid #1e120e;border-radius:10px 16px 24px 12px;transform:rotate(-9deg)}
#rifle .trigger{position:absolute;left:64px;top:168px;width:26px;height:32px;border:4px solid #222;border-top:0;border-radius:0 0 16px 16px}
#rifle.kick{animation:kick .14s ease-out}
@keyframes kick{50%{transform:translateX(-50%) translateY(10px) rotate(2deg)}}
.bug{position:absolute;z-index:10;width:74px;height:58px;transform:translate(-50%,-50%);filter:drop-shadow(0 7px 6px #0007)}
.bug .wing{position:absolute;top:8px;width:28px;height:20px;border-radius:50% 50% 60% 60%;border:2px solid #eefcff;background:linear-gradient(135deg,#ffffffdb,#bceeff66);box-shadow:inset 0 0 6px #fff}
.bug .wing.l{left:4px;transform:rotate(-14deg)} .bug .wing.r{right:4px;transform:rotate(14deg)}
.bug .body{position:absolute;left:18px;top:14px;width:38px;height:30px;border-radius:50%;border:2px solid #141414;background:repeating-linear-gradient(90deg,#161616 0 6px,#d8b437 6px 12px);box-shadow:inset -4px -3px 7px #0007,inset 3px 2px 4px #fff2}
.bug .eye{position:absolute;top:8px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffbdb6 0 25%,#dc4338 50%,#71140c 100%);box-shadow:0 1px 2px #000}
.bug .eye.l{left:18px}.bug .eye.r{right:18px}
.bug .legs:before,.bug .legs:after{content:"";position:absolute;top:34px;width:18px;height:2px;background:#2b241f;box-shadow:0 8px 0 #2b241f,0 16px 0 #2b241f}
.bug .legs:before{left:8px;transform:rotate(20deg)} .bug .legs:after{right:8px;transform:rotate(-20deg)}
.bugNo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:24px;height:24px;padding:0 4px;border-radius:50%;background:#fff;color:#111;border:2px solid #d71920;font-size:14px;line-height:20px;text-align:center;font-weight:1000;box-shadow:0 2px 5px #0009}
.hitFx{position:absolute;z-index:25;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 14px 8px #ffd23d,0 0 28px 16px #ff6200;transform:translate(-50%,-50%);animation:hit .16s ease-out forwards;pointer-events:none}
.hitText{position:absolute;z-index:25;color:#ffe54d;font-weight:1000;text-shadow:0 2px 3px #000;transform:translate(-50%,-50%);animation:floatUp .5s ease-out forwards}
@keyframes hit{to{opacity:0;transform:translate(-50%,-50%) scale(2.8)}}
@keyframes floatUp{to{opacity:0;transform:translate(-50%,-95%) scale(1.15)}}
#overlay{position:absolute;z-index:40;inset:0;background:#08101ddd;display:none;align-items:center;justify-content:center;padding:18px}
.card{width:100%;max-width:360px;background:#1b2d3c;border:1px solid #ffffff2f;border-radius:24px;padding:24px;color:#fff;text-align:center;box-shadow:0 12px 30px #0007}
.card h2{margin:0 0 8px;font-size:30px}
.card p{margin:8px 0;color:#dfe8f1;line-height:1.6;white-space:pre-line}
.actions{display:flex;gap:10px;margin-top:18px}
.actions button{flex:1;border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:1000}
.primary{background:#ffd13f;color:#201700}.secondary{background:#fff;color:#111}
</style>
</head>
<body>
<div id="game">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="topHud">
    <button id="backBtn">‹</button>
    <div class="stageCard">파리 <span id="waveLabel" style="margin-left:6px">1</span> 단계</div>
    <div class="timeCard">⏱ <span id="timeLeft" style="margin-left:6px">10.0</span>s</div>
  </div>
  <div class="subHud">
    <div class="scoreCard">🎯 SCORE <span id="score">0</span></div>
    <div class="missCard">MISS <span id="missDots" style="margin-left:8px">○ ○ ○</span></div>
  </div>
  <div id="levelBanner">1마리 출현!</div>
  <div id="cross"></div>
  <div id="rifle">
    <div class="muzzle"></div><div class="barrel"></div><div class="scope"></div><div class="body"></div><div class="stock"></div><div class="trigger"></div>
  </div>
  <div id="tip">번호 순서대로 조준 · 발사</div>
  <div id="overlay">
    <div class="card">
      <h2 id="ovTitle">실패했습니다</h2>
      <p id="ovText">다시 도전하세요</p>
      <div class="actions">
        <button class="primary" id="retryBtn">다시 시작</button>
        <button class="secondary" id="resetBtn">처음부터</button>
      </div>
    </div>
  </div>
</div>
<script>
const game=document.getElementById('game'), cross=document.getElementById('cross'), rifle=document.getElementById('rifle'), overlay=document.getElementById('overlay');
const scoreEl=document.getElementById('score'), waveLabel=document.getElementById('waveLabel'), timeLeftEl=document.getElementById('timeLeft'), missDotsEl=document.getElementById('missDots'), levelBanner=document.getElementById('levelBanner');
let wave=1, score=0, misses=0, flies=[], transitioning=false, running=true, last=performance.now(), timerHandle=null, stageDeadline=0;
const MAX_WAVE=10;
function bounds(){return game.getBoundingClientRect()}
function updateHud(){scoreEl.textContent=score;waveLabel.textContent=wave;missDotsEl.textContent=[0,1,2].map(i=>i<misses?'●':'○').join(' ')}
function showBanner(msg){levelBanner.textContent=msg;levelBanner.style.opacity='1';clearTimeout(showBanner._t);showBanner._t=setTimeout(()=>levelBanner.style.opacity='0.92',700)}
function stageSeconds(w){return w===1?10:w<=3?15:w<=6?20:25}
function stopTimer(){if(timerHandle){clearInterval(timerHandle);timerHandle=null}}
function startTimer(){stopTimer();const sec=stageSeconds(wave);stageDeadline=performance.now()+sec*1000;timeLeftEl.textContent=sec.toFixed(1);timerHandle=setInterval(()=>{if(transitioning)return;const left=Math.max(0,(stageDeadline-performance.now())/1000);timeLeftEl.textContent=left.toFixed(1);if(left<=0){stopTimer();failStage('시간 초과로 실패했습니다')}},100)}
function bugHtml(no){return '<div class="wing l"></div><div class="wing r"></div><div class="legs"></div><div class="body"></div><div class="eye l"></div><div class="eye r"></div><div class="bugNo">'+no+'</div>'}
function spawn(count){flies.forEach(f=>f.el.remove());flies=[];misses=0;updateHud();overlay.style.display='none';running=true;transitioning=false;const r=bounds();for(let i=0;i<count;i++){const el=document.createElement('div');el.className='bug';el.innerHTML=bugHtml(i+1);game.appendChild(el);const angle=Math.random()*6.28;const speed=115+wave*12;flies.push({el,alive:true,no:i+1,x:70+Math.random()*(r.width-140),y:170+Math.random()*(r.height*0.45-170),vx:Math.cos(angle)*speed,vy:Math.sin(angle)*(speed*0.72),phase:Math.random()*6.28})}showBanner(count+'마리 출현!');startTimer();last=performance.now()}
function nextWave(){stopTimer();if(wave<MAX_WAVE){wave++;spawn(wave)}else{transitioning=true;overlay.style.display='flex';document.getElementById('ovTitle').textContent='클리어!';document.getElementById('ovText').textContent='모든 파리 단계를 클리어했습니다. 점수 '+score}}
function failStage(reason){if(transitioning)return;stopTimer();transitioning=true;running=false;const retryWave=Math.max(1,wave-2);overlay.style.display='flex';document.getElementById('ovTitle').textContent='실패했습니다';document.getElementById('ovText').textContent=reason+'\n'+wave+'단계 → '+retryWave+'단계로 하락';overlay.dataset.retryWave=String(retryWave)}
function fireFx(x,y,text){const flash=document.createElement('div');flash.className='hitFx';flash.style.left=x+'px';flash.style.top=y+'px';game.appendChild(flash);setTimeout(()=>flash.remove(),180);const t=document.createElement('div');t.className='hitText';t.style.left=x+'px';t.style.top=y+'px';t.textContent=text;game.appendChild(t);setTimeout(()=>t.remove(),520);rifle.classList.remove('kick');void rifle.offsetWidth;rifle.classList.add('kick')}
function expectedNo(){const alive=flies.filter(f=>f.alive).map(f=>f.no);return alive.length?Math.min(...alive):null}
function shoot(x,y){if(transitioning||!running)return;const near=flies.filter(f=>f.alive).map(f=>({f,d:Math.hypot(f.x-x,f.y-y)})).sort((a,b)=>a.d-b.d)[0];if(near&&near.d<38){const need=expectedNo();if(near.f.no!==need){misses++;updateHud();fireFx(x,y,'MISS '+need+'번 먼저!');if(misses>=3)failStage('순서를 잘못 맞혔습니다');return}near.f.alive=false;near.f.el.remove();score+=100*wave;updateHud();fireFx(near.f.x,near.f.y,'💥 '+near.f.no);if(flies.every(f=>!f.alive))setTimeout(nextWave,320)}else{misses++;updateHud();fireFx(x,y,'MISS');if(misses>=3)failStage('MISS 3회로 실패했습니다')}}
function aimAt(x,y){cross.style.left=x+'px';cross.style.top=y+'px';const r=bounds();const ang=Math.atan2(x-r.width/2,Math.max(80,r.height-y))*18;rifle.style.transform='translateX(-50%) rotate('+ang+'deg)'}
function loop(now){const dt=Math.min(0.03,(now-last)/1000);last=now;if(running){const r=bounds();flies.filter(f=>f.alive).forEach((f,i)=>{f.phase+=dt*(3.2+i*0.08);f.vx+=Math.sin(f.phase*1.9)*(18+wave*2)*dt;f.vy+=Math.cos(f.phase*2.1)*(17+wave*2)*dt;f.x+=f.vx*dt+Math.sin(f.phase)*(8+wave*0.7)*dt;f.y+=f.vy*dt+Math.cos(f.phase*1.2)*(7+wave*0.55)*dt;if(f.x<38||f.x>r.width-38)f.vx*=-1;if(f.y<165||f.y>r.height*0.52)f.vy*=-1;f.x=Math.max(38,Math.min(r.width-38,f.x));f.y=Math.max(165,Math.min(r.height*0.52,f.y));f.el.style.left=f.x+'px';f.el.style.top=f.y+'px';f.el.style.transform='translate(-50%,-50%) rotate('+Math.sin(f.phase*2)*12+'deg)'})}requestAnimationFrame(loop)}
game.addEventListener('pointermove',e=>{const r=bounds();aimAt(e.clientX-r.left,e.clientY-r.top)});
game.addEventListener('pointerdown',e=>{if(e.target.closest('#backBtn')||e.target.closest('#overlay'))return;const r=bounds();shoot(e.clientX-r.left,e.clientY-r.top)});
document.getElementById('backBtn').addEventListener('click',()=>{if(window.AppNav)AppNav.postMessage('back')});
document.getElementById('retryBtn').addEventListener('click',()=>{wave=Number(overlay.dataset.retryWave||wave);spawn(wave)});
document.getElementById('resetBtn').addEventListener('click',()=>{wave=1;score=0;misses=0;updateHud();spawn(1)});
const r=bounds();aimAt(r.width/2,r.height*0.46);updateHud();spawn(1);requestAnimationFrame(loop);
</script>
</body>
</html>
