<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101821;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;touch-action:none}
#game{position:relative;width:100%;height:100%;max-width:520px;margin:auto;overflow:hidden;background:linear-gradient(#86d7ff 0%,#dff7ff 61%,#8acb66 62%,#487e36 100%);cursor:crosshair}

.fruitfly .eye{width:5px;height:5px;top:4px}.fruitfly .eye.l{left:7px}.fruitfly .eye.r{right:7px}
.fruitfly .wing{width:14px;height:9px;top:3px;border-width:1px}
.fruitfly .bugNo{min-width:15px;height:15px;line-height:15px;font-size:9px;top:48%}
#roundCard{position:absolute;z-index:50;inset:0;display:none;align-items:center;justify-content:center;background:#07131bc9;color:white;text-align:center;pointer-events:none}

#roundCard .big{font-size:34px;font-weight:1000}.small{font-size:16px;margin-top:8px;font-weight:800;opacity:.9}

.actions .retry{background:#ffd83d;color:#241c00}.actions .home{background:#fff;color:#17222b}
#deathFlash{position:absolute;z-index:45;inset:0;background:#d71920;opacity:0;pointer-events:none}

#deathBug.attack{display:block;animation:attackPlayer .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes attackPlayer{0%{top:30%;transform:translate(-50%,-50%) scale(.4) rotate(-15deg)}55%{top:65%;transform:translate(-50%,-50%) scale(1.15) rotate(12deg)}100%{top:91%;transform:translate(-50%,-50%) scale(2.3) rotate(-8deg)}}

#cross:before{width:70px;height:2px}#cross:after{width:2px;height:70px}

@keyframes flash{to{opacity:0;transform:translate(-50%,-50%) scale(3.2)}}

 background:linear-gradient(180deg,#72b84f,#3f7a35 65%,#244c2b);opacity:.88}

.rifleShape i{position:absolute;left:46px;top:-5px;width:37px;height:18px;border-radius:50%;background:#0c0c0c;border:5px solid #555}

.rifleShape em{position:absolute;left:20px;top:90px;width:35px;height:25px;border:5px solid #222;border-radius:50%}

.slingshotShape:before{left:20px;transform:rotate(-22deg)}.slingshotShape:after{right:20px;transform:rotate(22deg)}
.slingshotShape i{position:absolute;left:45px;top:65px;width:22px;height:80px;background:linear-gradient(90deg,#70421f,#bd7a3c,#4d2c18);border-radius:10px}

@keyframes weaponKick{50%{transform:translateX(-50%) translateY(9px) rotate(2deg)}}
@keyframes weaponHeavy{45%{transform:translateX(-50%) translateY(14px) rotate(4deg)}}

<body>
<div id="game"></div>
  <div class="cloud" style="left:-20px;top:18%"></div><div class="cloud" style="right:-35px;top:31%;transform:scale(.7)"></div>
  <div class="topHud">
    <button id="backBtn" aria-label="뒤로">‹</button>
    <div id="stageTitle"><span id="bugName">파리</span> <span id="wave">1</span>단계</div>
    <div id="timerBox">⏱ <span id="timeLeft">10.0</span>s</div>
  </div>
  <div class="subHud">
    <div class="scoreBox">🎯 SCORE <span id="score">0</span></div>
    <div id="missBox">MISS <span id="missDots">○ ○ ○</span></div>
  </div>
  <div class="hiddenStats">R<span id="round">1</span><span id="left">1</span></div>
  <div id="levelBanner">1마리 출현!</div><div id="roundCard"><div class="card"><div class="big" id="roundTitle">ROUND 1 CLEAR!</div><div class="small" id="roundSub">다음 곤충이 접근합니다...</div><div id="finalRecord" style="display:none"></div><div class="actions" id="failActions" style="display:none"><button class="retry" id="retryBtn">다시 도전</button><button class="home" id="homeBtn">처음부터</button></div></div></div>
  <div id="cross"><i></i></div><div id="flash"></div><div id="deathFlash"></div><div id="deathBug"></div>
  <div id="weaponStage" class="weapon-pistol">
  <div class="weaponArt">
    <div class="pistolShape"><i></i><b></b></div>
    <div class="rifleShape"><i></i><b></b><em></em></div>
    <div class="slingshotShape"><i></i><b></b></div>
    <div class="chopsticksShape"><i></i><b></b></div>
  </div>
</div>
  <div id="tip">번호 순서대로 조준 · 발사</div>
</div>
<script>
const game=document.getElementById('game'),cross=document.getElementById('cross'),gun=document.getElementById('weaponStage'),flash=document.getElementById('flash');
const intro=document.getElementById('intro'),startBtn=document.getElementById('startBtn'),
bestScoreEl={textContent:''},bestRoundEl={textContent:''},finalRecord=document.getElementById('finalRecord');let started=true,startTime=performance.now();
function loadBest(){bestScoreEl.textContent=localStorage.getItem('pestBestScore')||0;bestRoundEl.textContent=localStorage.getItem('pestBestRound')||'-'}
function saveRecord(){let sec=Math.floor((performance.now()-startTime)/1000),old=+(localStorage.getItem('pestBestScore')||0),rec='R'+round+' · '+wave+'/10';if(score>old)localStorage.setItem('pestBestScore',score);localStorage.setItem('pestBestRound',rec);finalRecord.style.display='block';finalRecord.innerHTML='이번 기록<br>점수 '+score+' · '+rec+' · '+sec+'초';loadBest()}
const scoreEl=document.getElementById('score'),waveEl=document.getElementById('wave'),leftEl=document.getElementById('left'),banner=document.getElementById('levelBanner');
const roundEl=document.getElementById('round'),bugNameEl=document.getElementById('bugName'),roundCard=document.getElementById('roundCard'),roundTitle=document.getElementById('roundTitle'),roundSub=document.getElementById('roundSub'),missDots=document.getElementById('missDots'),failActions=document.getElementById('failActions'),retryBtn=document.getElementById('retryBtn'),homeBtn=document.getElementById('homeBtn'),deathFlash=document.getElementById('deathFlash'),deathBug=document.getElementById('deathBug');
const BUGS=[
 {name:'파리',emoji:'🪰',cls:'',baseSpeed:145,turn:34,hit:34},
 {name:'모기',emoji:'🦟',cls:'mosquito',baseSpeed:185,turn:70,hit:22},
 {name:'초파리',emoji:'·',cls:'fruitfly',baseSpeed:198,turn:78,hit:18}
];
let flies=[],score=0,wave=1,round=1,misses=0,retryWave=1,audioCtx=null,last=performance.now(),bannerTimer,transitioning=false;
let aim={x:innerWidth/2,y:innerHeight*.42};
function bounds(){return game.getBoundingClientRect()}
function bug(){return BUGS[(round-1)%BUGS.length]}
function audio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function shotSound(){audio();let t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(55,t+.075);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.1);let n=audioCtx.createBufferSource(),buf=audioCtx.createBuffer(1,audioCtx.sampleRate*.055,audioCtx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);n.buffer=buf;let ng=audioCtx.createGain();ng.gain.value=.11;n.connect(ng);ng.connect(audioCtx.destination);n.start(t)}
function hitSound(){audio();let t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.setValueAtTime(430,t);o.frequency.exponentialRampToValueAtTime(145,t+.08);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(t+.11)}
function showBanner(s){banner.textContent=s;banner.style.opacity=1;clearTimeout(bannerTimer);bannerTimer=setTimeout(()=>banner.style.opacity=0,800)}
function bugHTML(no){return '<div class="wing l"></div><div class="wing r"></div><div class="body"></div><div class="eye l"></div><div class="eye r"></div><div class="bugNo">'+no+'</div>'}
function updateMiss(){missDots.textContent=[0,1,2].map(i=>i<misses?'●':'○').join(' ')}
function updateHUD(){roundEl.textContent=round;bugNameEl.textContent=bug().name;waveEl.textContent=wave;updateMiss()}
let stageTimer=null,stageDeadline=0;
function stageSeconds(w){return w===1?10:w<=3?15:w<=6?20:25}
function stopStageTimer(){clearInterval(stageTimer);stageTimer=null}
function startStageTimer(){stopStageTimer();let sec=stageSeconds(wave);stageDeadline=performance.now()+sec*1000;document.getElementById('timeLeft').textContent=sec.toFixed(1);stageTimer=setInterval(()=>{if(transitioning)return;let left=Math.max(0,(stageDeadline-performance.now())/1000);document.getElementById('timeLeft').textContent=left.toFixed(1);if(left<=0){stopStageTimer();showBanner('TIME OVER!');setTimeout(failStage,120)}},100)}
function spawn(n){
 flies.forEach(f=>f.el.remove());flies=[];transitioning=false;misses=0;cross.style.display='block';gun.classList.remove('dead');deathFlash.style.opacity='0';deathBug.classList.remove('attack');updateHUD();
 const r=bounds(),cfg=bug(),difficulty=((wave<=3?1+(wave-1)*.055:wave<=6?1.13+(wave-3)*.135:wave<=8?1.535+(wave-6)*.225:1.985+(wave-8)*.34)+(round-1)*.17)*1.10;
 for(let i=0;i<n;i++){
  const el=document.createElement('div');el.className='fly '+cfg.cls;el.innerHTML=bugHTML(i+1);game.appendChild(el);
  const a=Math.random()*Math.PI*2,s=cfg.baseSpeed*difficulty*(.72+Math.random()*.38);
  flies.push({el,x:45+Math.random()*(r.width-90),y:115+Math.random()*(r.height*.42),vx:Math.cos(a)*s,vy:Math.sin(a)*s*.7,phase:Math.random()*6.28,alive:true,no:i+1});
 }
 leftEl.textContent=n;showBanner(cfg.emoji+' '+cfg.name+' '+n+'마리 · 1번부터!');startStageTimer();
}
function aimAt(x,y){const r=bounds();aim.x=Math.max(25,Math.min(r.width-25,x));aim.y=Math.max(80,Math.min(r.height*.72,y));cross.style.left=aim.x+'px';cross.style.top=aim.y+'px';const gx=r.width/2,gy=r.height-10,ang=Math.atan2(aim.y-gy,aim.x-gx)*180/Math.PI+90;gun.style.transform=`translateX(-50%) rotate(${Math.max(-25,Math.min(25,ang))}deg)`}
function failStage(){
 if(transitioning)return;stopStageTimer();transitioning=true;retryWave=Math.max(1,wave-2);
 const cfg=bug();flies.forEach(f=>{if(f.alive)f.el.style.opacity='.25'});
 cross.style.display='none';deathBug.textContent=cfg.emoji;deathBug.classList.add('attack');
 setTimeout(()=>{game.classList.add('shake');gun.classList.add('dead');deathFlash.style.opacity='.72';setTimeout(()=>deathFlash.style.opacity='0',180)},470);
 setTimeout(()=>{
  deathBug.classList.remove('attack');game.classList.remove('shake');
  roundTitle.textContent='실패했습니다';saveRecord();
  roundSub.textContent=(cfg.name==='모기'||cfg.name==='초파리')?cfg.name+'에게 물려 실패했습니다.':cfg.name+'에게 공격당해 실패했습니다.';
  failActions.style.display='flex';roundCard.style.display='flex';
 },900);
}
function retryStage(){finalRecord.style.display='none';startTime=performance.now();wave=retryWave;misses=0;failActions.style.display='none';roundCard.style.display='none';spawn(wave)}
function resetGame(){finalRecord.style.display='none';startTime=performance.now();flies.forEach(f=>f.el.remove());flies=[];score=0;scoreEl.textContent=0;round=1;wave=1;misses=0;retryWave=1;transitioning=false;failActions.style.display='none';roundCard.style.display='none';spawn(1)}
retryBtn.addEventListener('click',e=>{e.stopPropagation();retryStage()});
homeBtn.addEventListener('click',e=>{e.stopPropagation();resetGame()});
function nextStage(){
 stopStageTimer();if(wave<10){wave++;setTimeout(()=>spawn(wave),550);return}
 transitioning=true;failActions.style.display='none';roundCard.style.display='flex';roundTitle.textContent='ROUND '+round+' CLEAR!';roundSub.textContent=(BUGS[round%BUGS.length]?.name||'새로운 곤충')+'이 접근합니다...';
 setTimeout(()=>{round++;wave=1;roundCard.style.display='none';spawn(1)},1450)
}

let selectedWeapon='권총';
function setSelectedWeapon(name){
 selectedWeapon=['권총','장총','새총','젓가락'].includes(name)?name:'권총';
 const ws=document.getElementById('weaponStage');
 ws.className=selectedWeapon==='장총'?'weapon-rifle':selectedWeapon==='새총'?'weapon-slingshot':selectedWeapon==='젓가락'?'weapon-chopsticks':'weapon-pistol';
}
window.setSelectedWeapon=setSelectedWeapon;
document.getElementById('backBtn').addEventListener('click',e=>{e.stopPropagation();if(window.AppNav)AppNav.postMessage('back')});
function weaponFeedback(x,y){
 const ws=document.getElementById('weaponStage');ws.classList.remove('weaponKick','weaponHeavy','weaponTap');void ws.offsetWidth;
 ws.classList.add(selectedWeapon==='장총'?'weaponHeavy':selectedWeapon==='젓가락'?'weaponTap':'weaponKick');
 const fx=document.createElement('div');
 fx.className=selectedWeapon==='젓가락'?'weaponFxChop':selectedWeapon==='새총'?'weaponFxSling':'weaponFxShot';
 fx.style.left=x+'px';fx.style.top=y+'px';game.appendChild(fx);setTimeout(()=>fx.remove(),180);
}

function shoot(x,y){
 if(!started||transitioning)return;aimAt(x,y);weaponFeedback(x,y);shotSound();flash.style.left=aim.x+'px';flash.style.top=aim.y+'px';flash.style.display='block';setTimeout(()=>flash.style.display='none',55);
 let target=null,best=1e9,cfg=bug();for(const f of flies){if(!f.alive)continue;let d=Math.hypot(f.x-x,f.y-y);if(d<cfg.hit&&d<best){best=d;target=f}}
 if(target){
   const expected=Math.min(...flies.filter(f=>f.alive).map(f=>f.no));
   if(target.no!==expected){misses++;updateMiss();showBanner('순서 MISS! '+expected+'번 먼저 · '+misses+'/3');if(misses>=3)setTimeout(failStage,180);return}
   target.alive=false;target.el.remove();hitSound();score+=100*round;scoreEl.textContent=score;const p=document.createElement('div');p.className='hit';p.style.left=target.x+'px';p.style.top=target.y+'px';p.textContent='💥 '+target.no+' HIT!';game.appendChild(p);setTimeout(()=>p.remove(),500);const alive=flies.filter(f=>f.alive).length;leftEl.textContent=alive;if(alive===0)nextStage()
 }
 else{misses++;updateMiss();showBanner('MISS! '+misses+'/3');if(misses>=3)setTimeout(failStage,180)}
}
game.addEventListener('pointerdown',e=>{let r=bounds();shoot(e.clientX-r.left,e.clientY-r.top)});
game.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){let r=bounds();aimAt(e.clientX-r.left,e.clientY-r.top)}});
function loop(now){
 const dt=Math.min(.03,(now-last)/1000);last=now;const r=bounds(),maxY=r.height*.60,cfg=bug(),difficulty=((wave<=3?1+(wave-1)*.055:wave<=6?1.13+(wave-3)*.135:wave<=8?1.535+(wave-6)*.225:1.985+(wave-8)*.34)+(round-1)*.17)*1.10;
 flies.forEach((f,i)=>{if(!f.alive)return;f.phase+=dt*(3.0+i*.10+difficulty*(wave>=7?.72:.38));f.vx+=Math.sin(f.phase*(wave>=7?2.35:1.75))*cfg.turn*difficulty*(wave>=7?1.38:1)*dt;f.vy+=Math.cos(f.phase*(wave>=7?2.75:2.25))*cfg.turn*difficulty*(wave>=7?1.42:1)*dt;if(cfg.cls==='mosquito'&&Math.random()<dt*(1.8+wave*.24)){f.vx+=(Math.random()-.5)*(95+wave*9);f.vy+=(Math.random()-.5)*(85+wave*8)}if(wave>=8&&Math.random()<dt*(.55+(wave-8)*.35)){f.vx+=(Math.random()-.5)*120;f.vy+=(Math.random()-.5)*100}let max=cfg.baseSpeed*difficulty*1.35,sp=Math.hypot(f.vx,f.vy);if(sp>max){f.vx*=max/sp;f.vy*=max/sp}f.x+=f.vx*dt+Math.sin(f.phase)*(28+wave*2.4)*dt;f.y+=f.vy*dt+Math.cos(f.phase*1.4)*(23+wave*2.0)*dt;if(f.x<24){f.x=24;f.vx=Math.abs(f.vx)}if(f.x>r.width-24){f.x=r.width-24;f.vx=-Math.abs(f.vx)}if(f.y<90){f.y=90;f.vy=Math.abs(f.vy)}if(f.y>maxY){f.y=maxY;f.vy=-Math.abs(f.vy)}f.el.style.left=f.x+'px';f.el.style.top=f.y+'px';f.el.style.transform=`translate(-50%,-50%) rotate(${Math.sin(f.phase)*18}deg)`});
 requestAnimationFrame(loop)
}
let r=bounds();aimAt(r.width/2,r.height*.43);loadBest();cross.style.display='block';spawn(1);requestAnimationFrame(loop);
</script>
<div id="weaponFx"></div></body>
</html>
